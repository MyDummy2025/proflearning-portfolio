    <script>
      (function () {
        // Save flag when Continue is clicked
        document.addEventListener("click", function (e) {
          const link = e.target.closest("#continue-link");
          if (link) {
            sessionStorage.setItem("openMainDialog", "true");
          }
        });

        // Run only on Main page
        if (window.location.pathname !== "/page-1") return;

        document.addEventListener("DOMContentLoaded", function () {
          if (sessionStorage.getItem("openMainDialog") !== "true") return;
          sessionStorage.removeItem("openMainDialog");

          // Wait until trigger exists
          const observer = new MutationObserver(() => {
            const btn = document.getElementById("open-main-dialog");
            if (btn) {
              btn.dispatchEvent(
                new MouseEvent("click", {
                  bubbles: true,
                  cancelable: true,
                  view: window,
                }),
              );
              observer.disconnect();
            }
          });

          observer.observe(document.body, {
            childList: true,
            subtree: true,
          });

          // Safety stop
          setTimeout(() => observer.disconnect(), 10000);
        });
      })();
    </script>
