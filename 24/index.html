    <script>
      (function () {
        const MODE = "session";

        function alreadyShown(key) {
          return sessionStorage.getItem(key) === "shown";
        }

        function markShown(key) {
          sessionStorage.setItem(key, "shown");
        }

        document.addEventListener("click", function (e) {
          const link = e.target.closest("[data-popup-trigger]");

          if (!link) return;

          sessionStorage.setItem(
            "pendingPopup",
            JSON.stringify({
              key: link.dataset.popupKey,
              trigger: link.dataset.popupTrigger,
            }),
          );
        });

        document.addEventListener("DOMContentLoaded", async function () {
          const raw = sessionStorage.getItem("pendingPopup");

          if (!raw) return;

          const data = JSON.parse(raw);

          sessionStorage.removeItem("pendingPopup");

          if (alreadyShown(data.key)) return;

          const btn = await waitForElement("#" + data.trigger, 10000);

          if (!btn) return;

          markShown(data.key);

          btn.click();
        });

        function waitForElement(selector, timeout) {
          return new Promise((resolve) => {
            const existing = document.querySelector(selector);

            if (existing) {
              resolve(existing);
              return;
            }

            const observer = new MutationObserver(() => {
              const el = document.querySelector(selector);

              if (el) {
                observer.disconnect();
                resolve(el);
              }
            });

            observer.observe(document.body, {
              childList: true,
              subtree: true,
            });

            setTimeout(() => {
              observer.disconnect();
              resolve(null);
            }, timeout);
          });
        }
      })();
    </script>
