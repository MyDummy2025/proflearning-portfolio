    <script>
      (function () {
        // -----------------------------------
        // SAVE POPUP REQUEST
        // -----------------------------------

        document.addEventListener("click", function (e) {
          const link = e.target.closest("[data-popup-trigger]");

          if (!link) return;

          sessionStorage.setItem(
            "pendingPopup",
            JSON.stringify({
              key: link.dataset.popupKey,
              trigger: link.dataset.popupTrigger,
            }),
          );
        });

        // -----------------------------------
        // OPEN POPUP
        // -----------------------------------

        window.addEventListener("load", async function () {
          const raw = sessionStorage.getItem("pendingPopup");

          if (!raw) return;

          const data = JSON.parse(raw);

          sessionStorage.removeItem("pendingPopup");

          // already shown?
          if (sessionStorage.getItem(data.key) === "shown") {
            return;
          }

          // wait a little extra for Webstudio hydration
          await delay(800);

          const btn = document.getElementById(data.trigger);

          if (!btn) {
            console.log("Popup trigger not found:", data.trigger);
            return;
          }

          // mark shown
          sessionStorage.setItem(data.key, "shown");

          // IMPORTANT:
          // Webstudio dialog trigger fix
          btn.dispatchEvent(
            new PointerEvent("pointerdown", {
              bubbles: true,
            }),
          );

          btn.dispatchEvent(
            new MouseEvent("click", {
              bubbles: true,
            }),
          );
        });

        function delay(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }
      })();
    </script>
